# Follow LNPANDY/NX2Apple main with a reviewed pull request into the existing personal branch.
# The merged official commit supplies .upstream-ref, so the engine never gets a separate pin bump.
# A fine-grained SYNC_TOKEN limited to this fork needs contents, pull requests, issues and workflows
# write because pull requests opened with GITHUB_TOKEN do not reliably start tests.yml and
# build-mac-app.yml. Nothing is pushed to main or merged automatically. Activation also makes
# local/powera the default branch so the schedule uses this personal configuration.
name: Sync upstream

on:
  schedule:
    - cron: '30 21 * * *'   # 21:30 UTC = 5:30 Beijing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-nx2apple-local-powera
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the upstream pull request
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the pull request token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is required with contents, pull requests, issues and workflows write, limited to this fork. GITHUB_TOKEN is not a substitute because the pull request must trigger tests.yml and build-mac-app.yml."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          ref: local/powera
          fetch-depth: 0
          persist-credentials: false

      - name: Capture the exact personal and upstream commits
        id: source
        run: |
          PERSONAL=$(git rev-parse HEAD)
          UPSTREAM=$(git ls-remote https://github.com/LNPANDY/NX2Apple.git refs/heads/main | cut -f1)
          [[ "$PERSONAL" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot resolve local/powera"; exit 1; }
          [[ "$UPSTREAM" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot read LNPANDY/NX2Apple main"; exit 1; }
          git fetch --no-tags https://github.com/LNPANDY/NX2Apple.git "$UPSTREAM"
          OLD_PIN=$(cat .upstream-ref)
          NEW_PIN=$(git show "$UPSTREAM:.upstream-ref")
          [[ "$OLD_PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid personal .upstream-ref"; exit 1; }
          [[ "$NEW_PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid upstream .upstream-ref"; exit 1; }
          {
            echo "PERSONAL=$PERSONAL"
            echo "UPSTREAM=$UPSTREAM"
            echo "OLD_PIN=$OLD_PIN"
            echo "NEW_PIN=$NEW_PIN"
            echo "BRANCH=sync/nx2apple-${UPSTREAM:0:7}"
          } >> "$GITHUB_ENV"
          if git merge-base --is-ancestor "$UPSTREAM" "$PERSONAL"; then
            echo "local/powera already contains $UPSTREAM"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or recover the sync branch
        id: branch
        if: steps.source.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@users.noreply.github.com"
          PR=$(gh pr list -R "${{ github.repository }}" --state all --base local/powera --head "$BRANCH" --json state,url --jq '([.[] | select(.state == "OPEN")] | .[0]) // .[0] | if . == null then "" else .state + " " + .url end')
          read -r PR_STATE PR_URL <<< "$PR"
          if [ -n "$PR_STATE" ] && [ "$PR_STATE" != "OPEN" ]; then
            echo "Existing $PR_STATE pull request: $PR_URL. Not reopening it or creating another."
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "reuse=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REMOTE=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          if [ -z "$REMOTE" ]; then
            if [ "$PR_STATE" = "OPEN" ]; then
              echo "Existing open pull request has no remote branch: $PR_URL. Leaving it unchanged."
              echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
              echo "reuse=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git checkout -b "$BRANCH" "$PERSONAL"
            echo "reuse=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REMOTE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Cannot resolve the existing $BRANCH branch"; exit 1; }
          git fetch --no-tags origin "$REMOTE"
          ACTUAL=$(git rev-list --parents -n 1 "$REMOTE")
          read -r MERGE FIRST SECOND EXTRA <<< "$ACTUAL"
          if [ "$MERGE" != "$REMOTE" ] || [ "$SECOND" != "$UPSTREAM" ] || [ -n "$EXTRA" ] || ! git merge-base --is-ancestor "$FIRST" "$PERSONAL"; then
            echo "::error::Existing $BRANCH is not an unchanged sync merge of an ancestor of local/powera and $UPSTREAM. Refusing to change it or reuse its pull request."
            exit 1
          fi
          if [ "$PR_STATE" = "OPEN" ]; then
            echo "Existing open pull request: $PR_URL"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "reuse=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          EXPECTED="$REMOTE $PERSONAL $UPSTREAM"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Existing $BRANCH does not contain the exact personal and upstream commits captured for this run. Refusing to open its pull request."
            exit 1
          fi
          git checkout -B "$BRANCH" "$REMOTE"
          echo "reuse=yes" >> "$GITHUB_OUTPUT"

      - name: Merge official NX2Apple without resolving conflicts
        id: merge
        if: steps.source.outputs.changed == 'yes' && steps.branch.outputs.reuse == 'no'
        run: |
          set +e
          git merge --no-ff --no-edit "$UPSTREAM" > merge.log 2>&1
          rc=$?
          set -e
          cat merge.log
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          printf '%s\n' "$CONFLICTS" > conflicts.log
          if [ "$rc" -ne 0 ]; then
            if [ -n "$CONFLICTS" ]; then echo "conflict=yes"; else echo "conflict=no"; fi >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi
          echo "conflict=no" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.source.outputs.changed == 'yes' && steps.branch.outputs.pr_url == ''
        with:
          python-version: '3.14'

      - name: Install the Python dependencies used by the pre-push checks
        if: steps.source.outputs.changed == 'yes' && steps.branch.outputs.pr_url == ''
        run: "python3 -m pip install --only-binary=:all: lz4==4.4.5 capstone==5.0.9 unicorn==2.1.4 fonttools"

      - name: Check the exact pin and merged patch series
        id: checks
        if: steps.source.outputs.changed == 'yes' && steps.branch.outputs.pr_url == ''
        run: |
          ACTUAL_PIN=$(cat .upstream-ref)
          if [ "$ACTUAL_PIN" != "$NEW_PIN" ]; then
            echo "::error::Merged .upstream-ref is $ACTUAL_PIN, expected exactly $NEW_PIN from $UPSTREAM"
            exit 1
          fi
          python3 tools/engine.py check 2>&1 | tee check.log
          python3 tools/engine.py sync 2>&1 | tee sync.log

      - name: Push only the sync branch
        id: push
        if: steps.source.outputs.changed == 'yes' && steps.branch.outputs.pr_url == '' && steps.branch.outputs.reuse == 'no'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # The upstream pre-push hook runs normally. It inherits no token environment variable,
          # while Git retains the temporary fork-only credential needed by hook commands.
          cleanup() { git config --local --unset-all http.https://github.com/.extraheader > /dev/null 2>&1 || true; }
          trap cleanup EXIT
          AUTH=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          unset SYNC_TOKEN AUTH
          git push -u origin "$BRANCH" 2>&1 | tee push.log

      - name: Open or find the pull request
        id: pr
        if: steps.source.outputs.changed == 'yes' && steps.branch.outputs.pr_url == ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          PR=$(gh pr list -R "${{ github.repository }}" --state all --base local/powera --head "$BRANCH" --json state,url --jq '([.[] | select(.state == "OPEN")] | .[0]) // .[0] | if . == null then "" else .state + " " + .url end')
          read -r PR_STATE PR_URL <<< "$PR"
          if [ -n "$PR_STATE" ]; then
            echo "Existing $PR_STATE pull request: $PR_URL. Not reopening it or creating another."
            exit 0
          fi
          RESULT=$(git rev-parse HEAD)
          {
            echo "Merges LNPANDY/NX2Apple main at \`$UPSTREAM\` into \`local/powera\`."
            echo
            echo "Personal base: \`$PERSONAL\`"
            echo
            echo "Merge result: \`$RESULT\`"
            echo
            echo "## Engine pin"
            echo
            echo "\`$OLD_PIN\` → \`$NEW_PIN\`"
            echo
            echo "The pin comes only from the merged official NX2Apple commit."
            echo
            echo "## Result against local/powera"
            echo
            echo '```'
            git diff --stat "$PERSONAL" HEAD | head -c 15000 || true
            echo
            echo '```'
            echo
            echo "## Patch and pin changes"
            echo
            echo '```'
            git diff --name-status "$PERSONAL" HEAD -- .upstream-ref patches | head -c 10000 || true
            echo
            echo '```'
            echo
            echo "## Upstream commits"
            echo
            echo "$(git rev-list --count --no-merges "$PERSONAL..$UPSTREAM") non-merge commits, at most 100 shown."
            echo
            echo '```'
            git log --no-merges -100 --format='%h %s' "$PERSONAL..$UPSTREAM"
            echo '```'
          } > body.md
          gh pr create -R "${{ github.repository }}" --base local/powera --head "$BRANCH" \
            --title "Sync NX2Apple ${UPSTREAM:0:7}" --body-file body.md 2>&1 | tee pr.log

      - name: Open or update an issue when synchronization fails
        if: failure() && steps.source.outputs.changed == 'yes' && steps.branch.outputs.pr_url == ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          TITLE="NX2Apple sync blocked at ${UPSTREAM:0:7}"
          {
            echo "The sync of official NX2Apple \`$UPSTREAM\` into \`local/powera\` at \`$PERSONAL\` did not complete. \`local/powera\` was not changed."
            echo
            echo "Resolve any reported conflict manually in a reviewed pull request. The workflow never chooses one side automatically. Check the push outcome before retrying because the sync branch may already be on origin."
            echo
            echo "## Step outcomes"
            echo
            echo "- Source: ${{ steps.source.outcome }}"
            echo "- Branch recovery: ${{ steps.branch.outcome }}"
            echo "- Merge: ${{ steps.merge.outcome }}"
            echo "- Pin and patch checks: ${{ steps.checks.outcome }}"
            echo "- Push: ${{ steps.push.outcome }}"
            echo "- Pull request: ${{ steps.pr.outcome }}"
            if [ -n "$(cat conflicts.log 2>/dev/null)" ]; then
              echo
              echo "## Conflicting paths"
              echo
              echo '```'
              cat conflicts.log
              echo '```'
            fi
            for LOG in merge.log check.log sync.log push.log pr.log; do
              if [ -f "$LOG" ]; then
                echo
                echo "## $LOG"
                echo
                echo '```'
                tail -60 "$LOG"
                echo '```'
              fi
            done
          } > issue.md
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "NX2Apple sync blocked in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue edit "$N" -R "${{ github.repository }}" --title "$TITLE" --body-file issue.md
          else
            gh issue create -R "${{ github.repository }}" --title "$TITLE" --body-file issue.md
          fi
